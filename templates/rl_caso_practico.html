{% extends 'base.html' %}

{% block title %}Entrenamiento Q-Learning{% endblock %}

{% block content %}

<!-- =======================
      CSS ESPECÍFICO
======================= -->
<style>
/* Caja de sección */
.section-box {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 12px;
    margin-top: 25px;
    border-left: 4px solid #ff6b35;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Títulos */
.section-box h3 {
    color: #ffae72;
    font-weight: bold;
    margin-bottom: 15px;
}

/* Inputs */
.section-box label {
    color: #ffd1bb;
    font-weight: bold;
}

.section-box input {
    background: rgba(255,255,255,0.8);
    border-radius: 8px;
}

/* Botones */
#trainBtn {
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    border: none;
    font-weight: bold;
}
#simulateBtn {
    background: linear-gradient(90deg, #28a745, #66dd77);
    border: none;
    font-weight: bold;
}
#trainBtn:hover, #simulateBtn:hover {
    transform: scale(1.04);
}

/* Resultado */
#status {
    font-size: 1.1rem;
    color: #ffe5d4;
    font-weight: bold;
}

/* Imágenes */
img {
    border-radius: 12px;
    border: 2px solid #444;
}
</style>

<!-- =======================
      CONTENIDO
======================= -->

<h1 style="color:white;">Entrenamiento Q-Learning</h1>

<div class="section-box">

    <div class="mb-3">
        <label>Episodios</label>
        <input id="episodes" type="number" value="{{ params['episodes'] }}" class="form-control" />
    </div>

    <div class="mb-3">
        <label>Tasa de aprendizaje (α)</label>
        <input id="alpha" type="number" step="0.01" value="{{ params['alpha'] }}" class="form-control" />
    </div>

    <div class="mb-3">
        <label>Factor de descuento (γ)</label>
        <input id="gamma" type="number" step="0.01" value="{{ params['gamma'] }}" class="form-control" />
    </div>

    <button id="trainBtn" class="btn btn-primary">Iniciar entrenamiento</button>
    <button id="simulateBtn" class="btn btn-success">Simular política entrenada</button>

    <div id="status" class="mt-3"></div>
</div>


<div class="section-box">
    <h3>Gráficos</h3>
    <img id="rewardsImg"
         src="{{ url_for('static', filename='images/rewards.png') }}?t=0"
         alt="Recompensas"
         class="img-fluid" />
</div>

<div class="section-box">
    <h3>Trayectoria</h3>
    <img id="trajImg"
         src="{{ url_for('static', filename='images/traj.png') }}?t=0"
         alt="Trayectoria"
         class="img-fluid" />
</div>


<!-- =======================
      JAVASCRIPT RL
======================= -->
<script>
document.getElementById('trainBtn').onclick = async function () {
    const params = {
        episodes: parseInt(document.getElementById('episodes').value),
        alpha: parseFloat(document.getElementById('alpha').value),
        gamma: parseFloat(document.getElementById('gamma').value)
    };

    document.getElementById('status').innerText = 'Entrenamiento iniciado...';

    const resp = await fetch('/reinforcement/train', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params)
    });

    const data = await resp.json();

    if (data.status === 'training_started') {
        document.getElementById('status').innerText =
            'Entrenando... revisa la consola del servidor.';

        setTimeout(() => {
            document.getElementById('rewardsImg').src =
                '/static/images/rewards.png?t=' + Date.now();
        }, 5000);
    }
};


document.getElementById('simulateBtn').onclick = async function () {
    const resp = await fetch('/reinforcement/simulate');
    const data = await resp.json();

    if (data.error) {
        document.getElementById('status').innerText =
            'No hay modelo entrenado.';
    } else {
        document.getElementById('status').innerText =
            'Simulación completada. Reward: ' + data.reward;

        document.getElementById('trajImg').src =
            '/static/images/traj.png?t=' + Date.now();
    }
};
</script>


{% endblock %}
