{% extends 'base.html' %} 

{% block title %}Entrenamiento Q-Learning{% endblock %}

{% block content %}

<style>
/* ========== ESTILO GENERAL PREMIUM ========== */
body {
    background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 50%, #1c1c1c 100%);
    font-family: 'Segoe UI', sans-serif;
}

/* ---------- Caja principal con efecto cristal ---------- */
.section-box {
    background: rgba(255,255,255,0.06);
    padding: 28px;
    border-radius: 15px;
    margin-bottom: 28px;
    border-left: 5px solid #ff6b35;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.section-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

.section-box h3 {
    color: #ffb88c;
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 18px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* ---------- Etiquetas e inputs ---------- */
.section-box label {
    color: #ffd9c7;
    font-weight: bold;
    margin-bottom: 8px;
    display: block;
    font-size: 0.95rem;
}

.section-box input {
    background: rgba(255,255,255,0.92);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 11px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    transition: all 0.25s ease;
}

.section-box input:focus {
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255,107,53,0.65);
    transform: scale(1.02);
}

/* ---------- Botones mejorados ---------- */
.btn-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 28px;
}

#trainBtn, #simulateBtn {
    width: 100%;
    padding: 14px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    font-size: 1.05rem;
    transition: all 0.28s ease;
    letter-spacing: 0.5px;
}

#trainBtn {
    background: linear-gradient(90deg, #ff6b35, #ff914d);
    color: white;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

#simulateBtn {
    background: linear-gradient(90deg, #1bbb4f, #72e085);
    color: white;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

#trainBtn:hover, #simulateBtn:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* ---------- Estado de proceso ---------- */
#status {
    font-size: 1.2rem;
    color: #ffe9dd;
    font-weight: bold;
    padding: 18px;
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    text-align: center;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
}

/* ---------- Gráficos y contenedores ---------- */
.graph-container {
    background: rgba(255,255,255,0.04);
    padding: 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
}

.graph-container img {
    border-radius: 15px;
    border: 2px solid rgba(255,255,255,0.15);
    width: 100%;
    height: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

/* ---------- Panel lateral con sticky ---------- */
.left-panel, .right-panel {
    display: flex;
    flex-direction: column;
}

.form-section {
    position: sticky;
    top: 20px;
}

/* ---------- Título principal ---------- */
h1 {
    text-shadow: 0 3px 10px rgba(0,0,0,0.4);
    letter-spacing: 1px;
    font-weight: bold;
    color: white;
}
</style>

<h1 style="margin-bottom: 30px;">Entrenamiento Q-Learning</h1>

<!-- =============================
      DISEÑO EN 2 COLUMNAS
============================= -->
<div class="row">
    
    <!-- ▓▓▓ IZQUIERDA — FORMULARIO ▓▓▓ -->
    <div class="col-md-5 left-panel">
        <div class="section-box form-section">
            <h3>Parámetros de Entrenamiento</h3>

            <div class="mb-4">
                <label>Episodios</label>
                <input id="episodes" type="number" value="{{ params['episodes'] }}" class="form-control" />
            </div>

            <div class="mb-4">
                <label>Tasa de aprendizaje (α)</label>
                <input id="alpha" type="number" step="0.01" value="{{ params['alpha'] }}" class="form-control" />
            </div>

            <div class="mb-4">
                <label>Factor de descuento (γ)</label>
                <input id="gamma" type="number" step="0.01" value="{{ params['gamma'] }}" class="form-control" />
            </div>

            <div class="btn-container">
                <button id="trainBtn" class="btn">🚀 Iniciar Entrenamiento</button>
                <button id="simulateBtn" class="btn">▶️ Simular Política Entrenada</button>
            </div>

            <div id="status" class="mt-4"></div>
        </div>
    </div>

    <!-- ▓▓▓ DERECHA — GRÁFICOS ▓▓▓ -->
    <div class="col-md-7 right-panel">
        
        <!-- Gráfico de Recompensas -->
        <div class="section-box">
            <h3>📊 Gráfico de Recompensas</h3>
            <div class="graph-container">
                <img id="rewardsImg"
                    src="{{ url_for('static', filename='images/rewards.png') }}?t=0"
                    alt="Recompensas"
                    class="img-fluid" />
            </div>
        </div>

        <!-- Trayectoria -->
        <div class="section-box">
            <h3>🎯 Trayectoria Aprendida</h3>
            <div class="graph-container">
                <img id="trajImg"
                    src="{{ url_for('static', filename='images/traj.png') }}?t=0"
                    alt="Trayectoria"
                    class="img-fluid" />
            </div>
        </div>
    </div>

</div>

<!-- =======================
      JAVASCRIPT RL
======================= -->
<script>
document.getElementById('trainBtn').onclick = async function () {
    const params = {
        episodes: parseInt(document.getElementById('episodes').value),
        alpha: parseFloat(document.getElementById('alpha').value),
        gamma: parseFloat(document.getElementById('gamma').value)
    };

    document.getElementById('status').innerText = '⏳ Entrenamiento iniciado...';

    const resp = await fetch('/reinforcement/train', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(params)
    });

    const data = await resp.json();

    if (data.status === 'training_started') {
        document.getElementById('status').innerText =
            'Entrenando... revisa la consola del servidor.';

        setTimeout(() => {
            document.getElementById('rewardsImg').src =
                '/static/images/rewards.png?t=' + Date.now();
        }, 5000);
    }
};

document.getElementById('simulateBtn').onclick = async function () {
    document.getElementById('status').innerText = '⏳ Simulando...';
    
    const resp = await fetch('/reinforcement/simulate');
    const data = await resp.json();

    if (data.error) {
        document.getElementById('status').innerText =
            'No hay modelo entrenado.';
    } else {
        document.getElementById('status').innerText =
            'Simulación completada. Reward: ' + data.reward.toFixed(2);

        document.getElementById('trajImg').src =
            '/static/images/traj.png?t=' + Date.now();
    }
};
</script>

{% endblock %}
